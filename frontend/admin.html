<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者画面へ移動</title>
  <!-- 管理者画面(?page=admin)への転送専用ページ。GASのURLはsinnovation.jpアカウントでログインしないとADMIN_EMAILS照合に失敗する -->
  <script src="js/config.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 80px 20px; color: #211d17; }
    a { color: #b6763a; }
  </style>
</head>
<body>
  <p>管理者画面へ移動しています…</p>
  <p>自動的に移動しない場合は<a id="admin-link" href="#">こちら</a>をクリックしてください。</p>
  <script>
    const adminUrl = GAS_ENDPOINT_URL + '?page=admin';
    document.getElementById('admin-link').href = adminUrl;
    location.href = adminUrl;
  </script>
</body>
</html>
