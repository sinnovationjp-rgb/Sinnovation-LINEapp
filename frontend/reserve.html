<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予約 - SPACE予約</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="reserve">
    <h1>予約</h1>
    <div id="calendar"></div>

    <form id="reserve-form">
      <label>予約希望日・時間帯 <input type="datetime-local" name="datetime" required></label>
      <label>参加人数 <input type="number" name="headcount" min="1" required></label>

      <fieldset>
        <legend>ご利用履歴</legend>
        <label><input type="radio" name="usageHistory" value="初めて" required> 初めて</label>
        <label><input type="radio" name="usageHistory" value="利用したことがある"> 利用したことがある</label>
      </fieldset>

      <fieldset>
        <legend>飲み放題の有無</legend>
        <label><input type="radio" name="allYouCanDrink" value="あり" required> あり</label>
        <label><input type="radio" name="allYouCanDrink" value="なし"> なし</label>
      </fieldset>

      <label>お名前 <input type="text" name="name" required></label>
      <label>電話番号 <input type="tel" name="phone" required></label>
      <label>備考 <textarea name="note"></textarea></label>
      <button type="submit">予約する</button>
    </form>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/liff-init.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/reserve-form.js"></script>
</body>
</html>
